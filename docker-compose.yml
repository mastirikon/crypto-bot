networks:
  egress:
    external: true
    name: egress_network
  crypto_bot:
    name: crypto_bot_network

#x-common-template: &common-template
#  restart: always
#  volumes:
#    - /etc/localtime:/etc/localtime:ro
#  networks:
#    - default
#    - crypto_bot_network

services:
  crypto-bot:
#    <<: *common-template
    container_name: crypto-bot
    build: .
    image: crypto-bot:latest
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_PROXY=http://egress-tunnel:8080
      - REDIS_HOST=crypto-redis
      - REDIS_PORT=6379
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=128
    networks: [egress, crypto_bot]
    hostname: crypto-bot
    volumes:
      - /etc/localtime:/etc/localtime:ro
#    ports:
#      - "3000:3000"
    depends_on:
      crypto-redis:
        condition: service_healthy
    restart: unless-stopped
#    deploy:
#      resources:
#        limits:
#          cpus: '0.3'
#          memory: 256M
#        reservations:
#          memory: 128M
#    logging:
#      driver: "json-file"
#      options:
#        max-size: "10m"
#        max-file: "3"
#
  crypto-redis:
#    <<: *common-template
    container_name: crypto-redis
    image: redis:7-alpine
    hostname: crypto-redis
    networks: [crypto_bot]
#    ports:
#      - "6380:6379"
    volumes:
      - crypto-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
#    deploy:
#      resources:
#        limits:
#          cpus: '0.2'
#          memory: 128M
#        reservations:
#          memory: 64M
#    logging:
#      driver: "json-file"
#      options:
#        max-size: "10m"
#        max-file: "3"
#
volumes:
  crypto-redis-data: